<svg xmlns="http://www.w3.org/2000/svg" viewBox="-17 5 160 160" width="64" height="64" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <path id="glass" d="M28 26 H92 C92 62 66 68 66 82 C66 96 92 102 92 138 H28 C28 102 54 96 54 82 C54 68 28 62 28 26 Z"/>
    <clipPath id="glassClip"><use href="#glass"/></clipPath>
  </defs>

  <!-- hard shadow -->
  <g transform="translate(9 9)" fill="#0a0a0a" stroke="#0a0a0a" stroke-width="8" stroke-linejoin="round">
    <use href="#glass"/>
    <rect x="14" y="10" width="92" height="16" rx="3"/>
    <rect x="14" y="138" width="92" height="16" rx="3"/>
  </g>

  <!-- glass -->
  <use href="#glass" fill="#cdefff"/>

  <!-- sand -->
  <g clip-path="url(#glassClip)">
    <rect x="20" y="46" width="80" height="36" fill="#ffd60a"/>
    <path d="M20 140 V120 Q60 96 100 120 V140 Z" fill="#ffd60a"/>
  </g>

  <!-- falling sand -->
  <line x1="60" y1="80" x2="60" y2="114" stroke="#0a0a0a" stroke-width="9" stroke-linecap="round"/>
  <line x1="60" y1="80" x2="60" y2="114" stroke="#ffd60a" stroke-width="4" stroke-linecap="round"/>

  <!-- outline -->
  <use href="#glass" fill="none" stroke="#0a0a0a" stroke-width="8" stroke-linejoin="round"/>

  <!-- caps -->
  <g fill="#e63946" stroke="#0a0a0a" stroke-width="8" stroke-linejoin="round">
    <rect x="14" y="10" width="92" height="16" rx="3"/>
    <rect x="14" y="138" width="92" height="16" rx="3"/>
  </g>
</svg>
